name: Run linter and tests
on:
  push:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.12
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - run: python -V
    - run: pip install --upgrade pip
    - run: pip install pdm
    - run: pdm install
    - run: pdm build
    - uses: actions/upload-artifact@v7
      if: success()
      with:
        name: "${{ github.job }}"
        path: dist/*.whl
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Set up postgres server
      uses: ikalnytskyi/action-setup-postgres@v8
      with:
        postgres-version: "17"
      id: postgres
    - name: Checkout version control files
      uses: actions/checkout@v7
    - name: Download artifacts
      uses: actions/download-artifact@v8
    - name: Check python version
      run: python -V
    - name: Install pdm tox flake8 
      run: pip install pdm tox flake8
    - name: Lint with flake8
      run: |
        pdm run flake8 ./src --count --select=E9,F63,F7,F82 --show-source --statistics
        pdm run flake8 ./src --count --exit-zero --max-complexity=20 --max-line-length=127 --statistics
    - name: Run tests
      run: pdm run tox
      env:
        PGSERVICE: ${{ steps.postgres.outputs.service-name }}
    - name: Install rsync for test badge deploy action
      run: |
        sudo apt-get update && sudo apt-get install -y rsync
    - name: Deploy test badge to main branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
          folder: test/badge
          target-folder: test/badge
          branch: main
