apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasources
  namespace: nvcl-projects
type: Opaque
stringData:
  postgres-ds.yaml: |
    apiVersion: 1
    datasources:
      - name: Postgres
        type: postgres
        access: proxy
        isDefault: true
        url: postgres:5432
        user: <db-user-here>
        secureJsonData:
          password: <db-password-here>
        jsonData:
          database: <db-name-here>
          sslmode: disable
          postgresVersion: 1700
          timescaledb: false
