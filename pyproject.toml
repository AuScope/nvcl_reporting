[project]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
name = "nvcl_reporting"
version = "1.0.0"
description = "Generates reports about creation of Australian National Virtual Core Library (NVCL) datasets"
authors = [
    {name = "Vincent Fazio", email = "vincent.fazio@csiro.au"},
    {name = "Shane Mule", email = "shane.mule@csiro.au"},
]

dependencies = [
    "shapely>=2.1.2",
    "pyproj==3.7.2",
    "pandas",
    "matplotlib",
    "wordcloud",
    "periodictable",
    "seaborn",
    "xmltodict",
    "nvcl-kit>=1.2.14",
    "fpdf2",
    "pillow",
    "cython",
    "fiscalyear>=0.4.0",
    "threddsclient>=0.4.7",
    "requests>=2.31.0",
    "python-dateutil>=2.9.0.post0",
    "contourpy>=1.3.3",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.48",
    "multiprocessing-logging>=0.4.0"
]
requires-python = "<3.15,>=3.11"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[dependency-groups]
test = [
    "pytest>=8.3.2",
    "tox",
    "pytest-postgresql",
    "psycopg[binary]"
]
